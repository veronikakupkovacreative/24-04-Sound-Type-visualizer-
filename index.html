const tools=[['TYPE//REACTOR','Sound—Type Reactive Visualizer','Sound-reactive typography engine.','TYPE//REACTOR is an audio-reactive typography tool that turns sound into distorted type systems. Upload audio or use microphone input and generate typographic visuals that react to energy, bass, mids, movement and distortion.\n\nIt is built for cover art, posters, music teasers, social visuals, experimental typography and dark identity systems.','Turn sound into unstable typography.','A sound-reactive type engine for distorted posters, covers and audio-driven visual identity.','Custom font upload locked. Only 2 presets. Export limited to max 1080px. Watermark enabled. No video export.','Custom font upload. Full preset access. Advanced typography controls. PNG/JPG export. Video export if available. SVG export if available. High-resolution export. No watermark. Commercial license.','Cover art\nTrack visuals\nExperimental posters\nDark typography systems\nSocial teaser graphics\nMusic release campaigns\nEditorial visual experiments'],['CHLADNI//FIELD','SOUND—CHLADNI Visualizer','Physical sound-pattern generator.','CHLADNI//FIELD is an audio-reactive visualizer inspired by Chladni patterns and physical vibration fields. It transforms audio into geometric sound structures that feel physical, dark and scientific.\n\nIt is made for musicians, sound designers, experimental designers and creators who want to make sound visible as physical-looking geometry.','Make sound visible as dark physical geometry.','A dark Chladni visual engine for turning tracks into physical-looking sound patterns.','Only 2 pattern presets. Advanced controls locked. Export limited to max 1080px. Watermark enabled. No video export.','Full pattern preset access. Simple and advanced control modes. Full control over structure, motion, intensity and reactivity. Full color and material controls. High-resolution export. Video export if available. No watermark. Commercial license.','Album visuals\nTrack artwor function home(){let total=data.calendarTasks.length,done=data.calendarTasks.filter(t=>t.status==='Done').length,prod=data.products.filter(p=>p.status==='In Progress'||p.status==='Demo Ready').length,ads=data.ads.filter(a=>a.status!=='Later').length;let today=todayISO();let upcoming=data.calendarTasks.filter(t=>t.date>=today&&t.status!=='Done').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);let active=data.products.find(p=>p.id===data.brand.activeProductId)||data.products[0];return `<section class="${activeCls('Homepage')}"><div class="hero"><div><div class="eyebrow">Internal workspace / local database</div><h2>Launch OS</h2></div><p>Central operating system for planning, organizing and launching UNDERGROUND Assets digital products. Built for dark product work: calendar, checklist, products, ads and copy-ready documentation.</p></div><div class="grid cols-4">${stat('Total tasks',total)}${stat('Completed tasks',done)}${stat('Products in progress',prod)}${stat('Ads planned',ads)}</div><div class="grid cols-3" style="margin-top:14px"><div class="card"><h3>Today’s tasks</h3>${taskList(data.calendarTasks.filter(t=>t.date===today))||'<div class="empty">No tasks today. Click a calendar day to add one.</div>'}</div><div class="card"><h3>Active product</h3><h2>${esc(active?.name||'No product')}</h2><span class="pill ${esc((active?.status||'').toLowerCase().replaceAll(' ','-'))}">${esc(active?.status||'')}</span><div class="bar" style="margin:12px 0"><i style="width:${active?.progress||0}%"></i></div><button class="primary" onclick="selectedProduct='${active?.id}';page='Products';render()">Open product</button></div><div class="card"><h3>Upcoming deadlines</h3>${taskList(upcoming)||'<div class="empty">No upcoming deadlines.</div>'}</div></div><div class="grid cols-2" style="margin-top:14px"><div class="card"><h3>90-day interactive launch calendar</h3>${calendarControls()}${calendar()}</div><div class="card"><h3>Launch timeline</h3><div class="timeline">${['Days 1–14: Brand and product foundation','Days 15–30: Demo versions and product packaging','Days 31–45: Product page and preview assets','Days 46–60: Launch','Days 61–75: Optimization','Days 76–90: Second product or bundle expansion'].map(x=>`<div><strong>${esc(x.split(':')[0])}</strong><p class="muted">${esc(x.split(': ')[1])}</p></div>`).join('')}</div><h3 style="margin-top:18px">Quick links</h3><div class="toolbar"><button class="primary" onclick="page='Products';render()">Products</button><button class="ghost" onclick="page='Checklist';render()">Checklist</button><button class="ghost" onclick="page='Advertising';render()">Advertising</button></div><p class="meta">Launch phase indicator: ${phase()}</p><div class="bar"><i style="width:${Math.min(100,Math.round((Date.now()-new Date(data.calendarTasks[0]?.date||today).getTime())/86400000/90*100))}%"></i></div></div></div></section>`}
function stat(k,v){return `<div class="card stat"><div class="meta">${k}</div><div class="value">${v}</div></div>`} function phase(){let d=Math.ceil((new Date(todayISO())-new Date(data.calendarTasks[0]?.date||todayISO()))/86400000)+1;return d<=14?'Brand and product foundation':d<=30?'Demo versions and packaging':d<=45?'Product page and preview assets':d<=60?'Launch':d<=75?'Optimization':'Second product or bundle expansion'}
function calendarControls(){return `<div class="toolbar"><select id="calView"><option ${data.settings.calendarView==='month'?'selected':''}>month</option><option ${data.settings.calendarView==='list'?'selected':''}>list</option></select><select id="taskCat"><option>All</option>${CATS.map(c=>`<option ${filters.taskCat===c?'selected':''}>${c}</option>`).join('')}</select><select id="taskStatus"><option>All</option>${['Open','In Progress','Done'].map(c=>`<option ${filters.taskStatus===c?'selected':''}>${c}</option>`).join('')}</select><select id="taskPriority"><option>All</option>${PRIORITIES.map(c=>`<option ${filters.taskPriority===c?'selected':''}>${c}</option>`).join('')}</select><button class="ghost" onclick="download('ua-calendar.json',JSON.stringify(data.calendarTasks,null,2))">Export calendar</button><button class="ghost" onclick="importFile.dataset.kind='calendar';importFile.click()">Import JSON</button></div>`}
function filterTasks(ts){return ts.filter(t=>(filters.taskCat==='All'||t.category===filters.taskCat)&&(filters.taskStatus==='All'||t.status===filters.taskStatus)&&(filters.taskPriority==='All'||t.priority===filters.taskPriority)&&(!filters.q||JSON.stringify(t).toLowerCase().includes(filters.q)))}
function calendar(){let tasks=filterTasks(data.calendarTasks); if(data.settings.calendarView==='list')return `<div>${taskList(tasks,true)||'<div class="empty">No matching tasks.</div>'}</div>`;let start=new Date();start.setDate(1);let days=[];for(let i=0;i<90;i++)days.push(addDays(i));return `<div class="calendar-head"><span class="meta">Next 90 days</span><span class="meta">Hover for tooltip / click for detail</span></div><div class="calendar-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="weekday">${d}</div>`).join('')}${days.map(d=>{let dt=tasks.filter(t=>t.date===d);return `<button class="day" onclick="openDay('${d}')"><div class="day-num">${new Date(d+'T00:00').getDate()}</div><div class="meta">${d.slice(5)}</div>${dt.slice(0,3).map(t=>`<span class="task-dot">${esc(t.title)}</span>`).join('')}<div class="tooltip">${dt.length?dt.map(t=>`• ${esc(t.title)} (${esc(t.priority)})`).join('<br>'):'No tasks'}</div></button>`}).join('')}</div>`}
function taskList(ts,showDate=false){return ts.map(t=>`<div class="list-row"><input type="checkbox" ${t.status==='Done'?'checked':''} onchange="setTaskDone('${t.id}',this.checked)"><div><strong>${esc(t.title)}</strong><div class="meta">${showDate?esc(t.date)+' / ':''}${esc(t.category)}</div><p class="muted">${esc(t.notes||'')}</p></div><span class="pill ${esc(t.priority.toLowerCase())}">${esc(t.priority)}</span></div>`).join('')}
function checklist(){let items=data.checklist.filter(i=>(filters.checkCat==='All'||i.category===filters.checkCat)&&(!filters.q||JSON.stringify(i).toLowerCase().includes(filters.q)));let global=progress(data.checklist);return `<section class="${activeCls('Checklist')}"><div class="hero"><h2>Checklist</h2><p>Interactive launch checklist with local progress, category filters and custom items.</p></div><div class="card"><div class="toolbar"><select id="checkCat"><option>All</option>${CATS.map(c=>`<option ${filters.checkCat===c?'selected':''}>${c}</option>`).join('')}</select><button class="primary" onclick="openChecklistItem()">Add custom item</button></div><h3>Global progress ${global}%</h3><div class="bar"><i style="width:${global}%"></i></div></div><div class="grid cols-2" style="margin-top:14px">${CATS.map(c=>{let its=items.filter(i=>i.category===c);let pct=progress(data.checklist.filter(i=>i.category===c));return `<div class="card"><h3>${c} <span class="meta">${pct}%</span></h3><div class="bar"><i style="width:${pct}%"></i></div><div style="margin-top:12px">${its.map(i=>`<div class="check-row ${i.done?'done':''}"><input type="checkbox" ${i.done?'checked':''} onchange="toggleCheck('${i.id}',this.checked)"><div><strong class="title">${esc(i.title)}</strong><div class="meta">${i.custom?'custom':'default'}</div></div><div>${i.custom?`<button class="ghost" onclick="openChecklistItem('${i.id}')">Edit</button><button class="danger" onclick="delCheck('${i.id}')">Delete</button>`:''}</div></div>`).join('')||'<div class="empty">No items match.</div>'}</div></div>`}).join('')}</div></section>`}
function products(){let list=data.products.filter(p=>(filters.productCat==='All'||p.category===filters.productCat||p.categories?.includes(filters.productCat))&&(filters.productStatus==='All'||p.status===filters.productStatus)&&(!filters.q||JSON.stringify(p).toLowerCase().includes(filters.q)));let detail=data.products.find(p=>p.id===selectedProduct);return `<section class="${activeCls('Products')}"><div class="hero"><h2>Products</h2><p>Product library grouped by Design, Music, Plugins, Tools, Bundles and Freebies. Products live here only, not in main navigation.</p></div><div class="toolbar"><select id="productCat"><option>All</option>${PRODUCT_CATS.map(c=>`<option ${filters.productCat===c?'selected':''}>${c}</option>`).join('')}</select><select id="productStatus"><option>All</option>${STATUSES.map(s=>`<option ${filters.productStatus===s?'selected':''}>${s}</option>`).join('')}</select><button class="primary" onclick="openProductForm()">Add product</button><button class="ghost" onclick="download('ua-products.json',JSON.stringify(data.products,null,2))">Export all JSON</button></div>${detail?productDetail(detail):productGroups(list)}</section>`}
function productGroups(list){if(!list.length)return '<div class="empty">No products. Add a new product to start the library.</div>';return PRODUCT_CATS.map(c=>{let group=list.filter(p=>p.category===c||p.categories?.includes(c));return group.length?`<div class="card" style="margin-bottom:14px"><h3>${c}</h3><div class="grid cols-3">${group.map(productCard).join('')}</div></div>`:''}).join('')}
function productCard(p){return `<div class="card product-card"><div><span class="pill">${esc((p.categories||[p.category]).join(' / '))}</span><h3>${esc(p.name)}</h3><p class="muted">${esc(p.shortDescription)}</p></div><div><span class="pill ${esc(p.status.toLowerCase().replaceAll(' ','-'))}">${esc(p.status)}</span> <span class="pill">${esc(p.price)}</span></div><div class="meta">Free: ${p.freeAvailable?'yes':'no'} / Paid: ${p.paidAvailable?'yes':'no'} / Updated ${esc(p.lastUpdated)}</div><div class="bar"><i style="width:${p.progress||0}%"></i></div><div class="tags">${(p.tags||[]).map(t=>`<span class="pill">#${esc(t)}</span>`).join('')}</div><button class="primary" onclick="selectedProduct='${p.id}';render()">Open product detail</button></div>`}
function productDetail(p){let names=['Product positioning','Hero copy','Short product description','Long product description','Included items','Free version','Paid version','Use cases','Target audience','Who it is not for','Gumroad / Lemon Squeezy copy','Telegram copy','Instagram caption','Pinterest titles and descriptions','README draft','License notes','Folder structure','FAQ','Launch checklist','Preview asset checklist'];return `<button class="ghost" onclick="selectedProduct=null;render()">← Back to library</button><div class="card" style="margin-top:12px"><div class="hero"><div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.positioning||'')}</p></div><div class="toolbar"><button class="ghost" onclick="openProductForm('${p.id}')">Edit core</button><button class="ghost" onclick="duplicateProduct('${p.id}')">Duplicate</button><button class="ghost" onclick="exportProductMarkdown('${p.id}')">Export Markdown</button><button class="danger" onclick="deleteProduct('${p.id}')">Delete</button></div></div><div class="grid cols-4">${stat('Progress',String(p.progress||0)+'%')}${stat('Price',p.price||'—')}${stat('Status',p.status)}${stat('Launch',p.launchDate||'—')}</div></div><div class="card" style="margin-top:14px"><h3>Individual tools</h3><div class="grid cols-2">${(p.tools||[]).map(tool=>`<div class="section-block"><h3>${esc(tool.productName)}</h3><p class="meta">Original: ${esc(tool.originalSourceName)}</p><p>${esc(tool.shortDescription)}</p>${['fullDescription','mainSellingPoint','productClaim','freeVersion','paidVersion','useCases'].map(k=>`<label class="meta">${k}</label><textarea data-tool="${tool.id}" data-key="${k}">${esc(tool[k])}</textarea>`).join('')}<button class="ghost" onclick="copyText(${JSON.stringify(tool.fullDescription)})">Copy tool description</button></div>`).join('')}</div></div><div class="card" style="margin-top:14px"><h3>Copy-ready editable sections</h3>${names.map(n=>{let val=p.sections?.[n]||p[n[0].toLowerCase()+n.slice(1).replaceAll(' ','')]||''; if(n==='Short product description')val=p.shortDescription;if(n==='Long product description')val=p.longDescription;if(n==='Target audience')val=p.targetAudience;return `<div class="section-block"><header><strong>${n}</strong><button class="ghost" onclick="copyText(document.querySelector('[data-section=&quot;${n}&quot;]').value)">Copy</button></header><textarea data-product="${p.id}" data-section="${n}">${esc(val)}</textarea></div>`}).join('')}</div>`}
function advertising(){return `<section class="${activeCls('Advertising')}"><div class="hero"><h2>Advertising</h2><p>Pinterest for evergreen discovery. Meta mainly for retargeting. Etsy only for search-driven products. Creative Market for asset discovery. Google later for precise search intent.</p></div><div class="grid cols-2">${data.ads.map(a=>`<div class="card"><h3>${esc(a.name)}</h3><p class="muted">${esc(a.description)}</p><p><strong>Best use:</strong> ${esc(a.bestUseCase)}</p><div class="form-grid"><label>Budget<input class="field" data-ad="${a.id}" data-key="budget" value="${esc(a.budget)}"></label><label>Status<input class="field" data-ad="${a.id}" data-key="status" value="${esc(a.status)}"></label><label>Priority<select data-ad="${a.id}" data-key="priority">${PRIORITIES.map(p=>`<option ${a.priority===p?'selected':''}>${p}</option>`).join('')}</select></label><label>UTM link<input class="field" data-ad="${a.id}" data-key="utm" value="${esc(a.utm)}"></label><label>Spend<input class="field" data-ad="${a.id}" data-key="spend" value="${esc(a.spend)}"></label><label>Clicks<input class="field" data-ad="${a.id}" data-key="clicks" value="${esc(a.clicks)}"></label><label>Leads<input class="field" data-ad="${a.id}" data-key="leads" value="${esc(a.leads)}"></label><label>Sales<input class="field" data-ad="${a.id}" data-key="sales" value="${esc(a.sales)}"></label><label>ROAS<input class="field" data-ad="${a.id}" data-key="roas" value="${esc(a.roas)}"></label><label class="full">Notes<textarea data-ad="${a.id}" data-key="notes">${esc(a.notes)}</textarea></label></div><h3>Checklist</h3>${a.checklist.map(c=>`<div class="check-row ${c.done?'done':''}"><input type="checkbox" ${c.done?'checked':''} onchange="toggleAdCheck('${a.id}','${c.id}',this.checked)"><div class="title">${esc(c.title)}</div></div>`).join('')}</div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>Results table</h3>${data.ads.map(a=>`<div class="ad-row"><strong>${esc(a.name)}</strong><span class="meta">Spend ${a.spend} / Clicks ${a.clicks} / Leads ${a.leads} / Sales ${a.sales}</span><span class="pill">ROAS ${a.roas}</span></div>`).join('')}<button class="ghost" onclick="exportAdsCSV()">Export CSV</button></div></section>`}
function master(){return `<section class="${activeCls('Master Document')}"><div class="hero"><h2>Master Document</h2><p>Copy-paste knowledge base for brand, product, marketing, README, license and launch information.</p></div><div class="toolbar"><button class="ghost" onclick="exportMasterMarkdown()">Export Markdown</button></div>${data.masterDocument.map(b=>`<div class="card section-block"><header><div><h3>${esc(b.title)}</h3><span class="meta">Last edited ${esc(b.lastEdited)}</span></div><button class="ghost" onclick="copyText(document.querySelector('[data-block=&quot;${b.id}&quot;]').value)">Copy</button></header><textarea data-block="${b.id}">${esc(b.content)}</textarea></div>`).join('')}</section>`}
function settings(){return `<section class="${activeCls('Settings / Data')}"><div class="hero"><h2>Settings / Data</h2><p>Local storage controls, import/export, reset, backup reminder and theme.</p></div><div class="grid cols-2"><div class="card"><h3>Data</h3><div class="toolbar"><button class="primary" onclick="download('underground-assets-launch-os-backup.json',JSON.stringify(data,null,2))">Export all app data as JSON</button><button class="ghost" onclick="importFile.dataset.kind='all';importFile.click()">Import app data from JSON</button><button class="ghost" onclick="if(confirm('Reset demo data?')){data=defaultData();save();render()}">Reset demo data</button><button class="danger" onclick="if(confirm('Clear local storage?')){localStorage.removeItem(KEY);data=defaultData();render()}">Clear local storage</button></div></div><div class="card"><h3>Preferences</h3><label>Backup reminder<textarea id="backupReminder">${esc(data.settings.backupReminder)}</textarea></label><label><input type="checkbox" ${data.settings.theme==='light'?'checked':''} id="themeCheck"> Light mode (dark is default)</label></div></div></section>`}
function bind(){let cv=document.getElementById('calView');if(cv)cv.onchange=e=>{data.settings.calendarView=e.target.value;save();render()};['taskCat','taskStatus','taskPriority','productCat','productStatus','checkCat'].forEach(id=>{let el=document.getElementById(id);if(el)el.onchange=e=>{filters[id]=e.target.value;render()}});document.querySelectorAll('[data-section]').forEach(el=>el.oninput=e=>{let p=data.products.find(x=>x.id===e.target.dataset.product);p.sections[e.target.dataset.section]=e.target.value;p.lastUpdated=todayISO();save()});document.querySelectorAll('[data-tool]').forEach(el=>el.oninput=e=>{let p=data.products.find(x=>x.tools?.some(t=>t.id===e.target.dataset.tool));let t=p.tools.find(t=>t.id===e.target.dataset.tool);t[e.target.dataset.key]=e.target.value;p.lastUpdated=todayISO();save()});document.querySelectorAll('[data-ad]').forEach(el=>el.oninput=e=>{let a=data.ads.find(x=>x.id===e.target.dataset.ad);a[e.target.dataset.key]=e.target.value;save()});document.querySelectorAll('[data-block]').forEach(el=>el.oninput=e=>{let b=data.masterDocument.find(x=>x.id===e.target.dataset.block);b.content=e.target.value;b.lastEdited=new Date().toLocaleString();save()});let br=document.getElementById('backupReminder');if(br)br.oninput=e=>{data.settings.backupReminder=e.target.value;save()};let tc=document.getElementById('themeCheck');if(tc)tc.onchange=e=>{data.settings.theme=e.target.checked?'light':'dark';save();render()}}
globalSearch.oninput=render;toggleTheme.onclick=()=>{data.settings.theme=data.settings.theme==='light'?'dark':'light';save();render()};exportAllTop.onclick=()=>download('underground-assets-launch-os-backup.json',JSON.stringify(data,null,2));openPalette.onclick=()=>palette.classList.toggle('open');document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();globalSearch.focus()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette.classList.toggle('open');paletteInput.focus()}});paletteInput.oninput=()=>{let q=paletteInput.value.toLowerCase();let rows=[...data.products.map(p=>['Product',p.name,()=>{selectedProduct=p.id;page='Products';render();palette.classList.remove('open')}]),...data.calendarTasks.map(t=>['Task',t.title,()=>openDay(t.date)]),...data.masterDocument.map(b=>['Doc',b.title,()=>{page='Master Document';render();palette.classList.remove('open')}])].filter(r=>r[1].toLowerCase().includes(q));paletteResults.innerHTML=rows.slice(0,20).map((r,i)=>`<button class="ghost" style="display:block;width:100%;margin-bottom:6px" onclick="paletteActions[${i}]()"><span class="meta">${r[0]}</span> ${esc(r[1])}</button>`).join('')||'<div class="empty">No results</div>';window.paletteActions=rows.map(r=>r[2])};
closeModal.onclick=()=>modal.classList.remove('open');function openModal(title,body){modalTitle.textContent=title;modalBody.innerHTML=body;modal.classList.add('open')}
function openDay(date){let ts=data.calendarTasks.filter(t=>t.date===date);openModal('Day detail '+date,`<div id="dayTasks">${ts.map(dayTaskForm).join('')||'<div class="empty">No tasks for this day.</div>'}</div><button class="primary" onclick="addTaskToDay('${date}')">Add custom task</button>`)}

function addTaskToDay(date){data.calendarTasks.push({id:uid('task'),date,title:'New launch task',category:'Product',priority:'Medium',status:'Open',notes:''});save();openDay(date);render()} function updateTask(id,k,v){let t=data.calendarTasks.find(x=>x.id===id);t[k]=v;save();render()} function deleteTask(id,date){if(confirm('Delete this task?')){data.calendarTasks=data.calendarTasks.filter(t=>t.id!==id);save();openDay(date);render()}} function setTaskDone(id,done){updateTask(id,'status',done?'Done':'Open')}
function toggleCheck(id,done){data.checklist.find(i=>i.id===id).done=done;save();render()} function openChecklistItem(id){let i=data.checklist.find(x=>x.id===id)||{id:'',category:'Brand',title:''};openModal(id?'Edit checklist item':'Add custom checklist item',`<label>Title<input class="field" id="ciTitle" value="${esc(i.title)}"></label><label>Category<select id="ciCat">${CATS.map(c=>`<option ${i.category===c?'selected':''}>${c}</option>`).join('')}</select></label><button class="primary" onclick="saveCheckItem('${id||''}')">Save</button>`)} function saveCheckItem(id){if(id){let i=data.checklist.find(x=>x.id===id);i.title=ciTitle.value;i.category=ciCat.value}else data.checklist.push({id:uid('check'),category:ciCat.value,title:ciTitle.value,done:false,custom:true});save();modal.classList.remove('open');render()} function delCheck(id){if(confirm('Delete custom checklist item?')){data.checklist=data.checklist.filter(i=>i.id!==id);save();render()}}
function openProductForm(id){let p=data.products.find(x=>x.id===id)||{name:'',category:'Design',status:'Idea',shortDescription:'',longDescription:'',targetAudience:'',freeVersionDescription:'',paidVersionDescription:'',includedFiles:'',licenseType:'',price:'',launchDate:'',previewAssetsNeeded:'',marketingChannels:'',notes:'',tags:[],progress:0,freeAvailable:false,paidAvailable:false,sections:{},tools:[]};let fields=['name','shortDescription','longDescription','targetAudience','freeVersionDescription','paidVersionDescription','includedFiles','licenseType','price','launchDate','previewAssetsNeeded','marketingChannels','notes','tags'];openModal(id?'Edit product':'Add product',`<div class="form-grid"><label>Category<select id="pf_category">${PRODUCT_CATS.map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Status<select id="pf_status">${STATUSES.map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Progress<input class="field" id="pf_progress" type="number" value="${p.progress||0}"></label><label>Free available <select id="pf_freeAvailable"><option ${p.freeAvailable?'selected':''}>true</option><option ${!p.freeAvailable?'selected':''}>false</option></select></label><label>Paid available <select id="pf_paidAvailable"><option ${p.paidAvailable?'selected':''}>true</option><option ${!p.paidAvailable?'selected':''}>false</option></select></label>${fields.map(f=>`<label class="${['longDescription','notes'].includes(f)?'full':''}">${f}<textarea id="pf_${f}">${esc(Array.isArray(p[f])?p[f].join(', '):p[f]||'')}</textarea></label>`).join('')}</div><button class="primary" onclick="saveProduct('${id||''}')">Save product</button>`)}
function saveProduct(id){let p=id?data.products.find(x=>x.id===id):{id:uid('prod'),sections:{},tools:[]};['name','shortDescription','longDescription','targetAudience','freeVersionDescription','paidVersionDescription','includedFiles','licenseType','price','launchDate','previewAssetsNeeded','marketingChannels','notes'].forEach(f=>p[f]=document.getElementById('pf_'+f).value);p.category=pf_category.value;p.categories=[p.category];p.status=pf_status.value;p.progress=Number(pf_progress.value)||0;p.freeAvailable=pf_freeAvailable.value==='true';p.paidAvailable=pf_paidAvailable.value==='true';p.tags=pf_tags.value.split(',').map(x=>x.trim()).filter(Boolean);p.lastUpdated=todayISO();if(!id)data.products.push(p);save();modal.classList.remove('open');selectedProduct=p.id;render()} function deleteProduct(id){if(confirm('Delete this product?')){data.products=data.products.filter(p=>p.id!==id);selectedProduct=null;save();render()}} function duplicateProduct(id){let p=JSON.parse(JSON.stringify(data.products.find(x=>x.id===id)));p.id=uid('prod');p.name+=' Copy';p.lastUpdated=todayISO();data.products.push(p);save();selectedProduct=p.id;render()} function exportProductMarkdown(id){let p=data.products.find(x=>x.id===id);let md=`# ${p.name}\n\n${Object.entries(p.sections||{}).map(([k,v])=>`## ${k}\n\n${v}`).join('\n\n')}`;download(p.name.replace(/\W+/g,'-')+'.md',md,'text/markdown')}
function toggleAdCheck(aid,cid,done){data.ads.find(a=>a.id===aid).checklist.find(c=>c.id===cid).done=done;save();render()} function exportAdsCSV(){download('ua-ad-results.csv','channel,spend,clicks,leads,sales,roas\n'+data.ads.map(a=>[a.name,a.spend,a.clicks,a.leads,a.sales,a.roas].join(',')).join('\n'),'text/csv')} function exportMasterMarkdown(){download('ua-master-document.md',data.masterDocument.map(b=>`# ${b.title}\n\n${b.content}`).join('\n\n'),'text/markdown')}
importFile.onchange=e=>{let file=e.target.files[0];if(!file)return;file.text().then(txt=>{try{let obj=JSON.parse(txt);if(importFile.dataset.kind==='calendar'){if(!Array.isArray(obj))throw Error('Calendar import must be an array');data.calendarTasks=obj}else{if(!obj.brand||!obj.products)throw Error('Invalid app data');data=obj}save();render()}catch(err){alert('Import failed: '+err.message)}});e.target.value=''};
render();
</script>
